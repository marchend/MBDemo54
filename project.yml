name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  # Pinned to the 2.0.x patch range, NOT `from: "2.0.0"` (which would
  # silently pull any future 2.x minor/patch on a clean resolve). For
  # an auth library a silent dependency drift is a higher-than-usual
  # risk, so any minor bump must be an explicit, reviewed diff here.
  # The exact resolved version is tracked in Package.resolved (sitting
  # inside the generated *.xcodeproj/project.xcworkspace/xcshareddata/
  # swiftpm/ — kept stable across `xcodegen generate` runs by Xcode's
  # own resolution cache and by the CI swiftpm cache key in
  # .github/workflows/ios-build.yml).
  OktaMobileSDK:
    url: https://github.com/okta/okta-mobile-swift
    minorVersion: "2.0.0"
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    dependencies:
      - package: OktaMobileSDK
        product: WebAuthenticationUI
      - package: OktaMobileSDK
        product: AuthFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: AcmeBank/Generated-Info.plist
      properties:
        CFBundleDisplayName: AcmeBank
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Okta tenant configuration. These are intentionally EMPTY in
        # source; the real values are written into the built Info.plist
        # at build time by Scripts/inject-okta-config.sh (a Run Script
        # preBuildScripts phase) from OKTA_* environment variables.
        # The keys MUST exist here so `plutil -replace` has something
        # to overwrite. Never commit real values here.
        OktaIssuer: ""
        OktaClientID: ""
        OktaRedirectURI: ""
        OktaScopes: ""
    preBuildScripts:
      # MUST run before "Copy Bundle Resources" so the Info.plist write
      # happens before the bundle is assembled. XcodeGen places
      # preBuildScripts ahead of Copy Bundle Resources by construction.
      - script: |
          "$SRCROOT/Scripts/inject-okta-config.sh"
        name: Inject Okta config from environment
        inputFiles:
          - $(SRCROOT)/Scripts/inject-okta-config.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # `basedOnDependencyAnalysis: false` instructs Xcode to ignore
        # the inputFiles/outputFiles timestamp comparison and run the
        # script on EVERY build invocation, not only when an input is
        # newer than its output. This is required: the script's real
        # input is the process environment (OKTA_* env vars), which
        # Xcode's dependency engine can't see. Without this flag, an
        # incremental build after a `launchctl setenv` change would
        # keep the previously-baked values.
        basedOnDependencyAnalysis: false
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
schemes:
  AcmeBank:
    build:
      targets:
        AcmeBank: all
    test:
      targets: [AcmeBankTests]
